<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1A2E5A"/>
      <stop offset="100%" stop-color="#2D5FA6"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F7B32B"/>
      <stop offset="100%" stop-color="#F28F3B"/>
    </linearGradient>
  </defs>

  <!-- Hintergrund mit abgerundeten Ecken -->
  <rect x="0" y="0" width="256" height="256" rx="38" fill="url(#bg)"/>

  <!-- Y-Achse -->
  <line x1="52" y1="48" x2="52" y2="200" stroke="white" stroke-width="3" stroke-opacity="0.5" stroke-linecap="round"/>

  <!-- X-Achse -->
  <line x1="52" y1="200" x2="220" y2="200" stroke="white" stroke-width="3" stroke-opacity="0.5" stroke-linecap="round"/>

  <!-- Horizontale Gitterlinien -->
  <line x1="52" y1="162" x2="220" y2="162" stroke="white" stroke-width="1" stroke-opacity="0.2"/>
  <line x1="52" y1="124" x2="220" y2="124" stroke="white" stroke-width="1" stroke-opacity="0.2"/>
  <line x1="52" y1="86"  x2="220" y2="86"  stroke="white" stroke-width="1" stroke-opacity="0.2"/>

  <!-- Säulen (weiß, halbtransparent) -->
  <rect x="64"  y="170" width="28" height="30" rx="4" fill="white" fill-opacity="0.35"/>
  <rect x="106" y="148" width="28" height="52" rx="4" fill="white" fill-opacity="0.35"/>
  <rect x="148" y="118" width="28" height="82" rx="4" fill="white" fill-opacity="0.35"/>
  <rect x="190" y="80"  width="28" height="120" rx="4" fill="white" fill-opacity="0.35"/>

  <!-- Trendlinie (weiß, solid) -->
  <polyline points="78,175 120,153 162,123 204,85"
            fill="none" stroke="white" stroke-width="4.5"
            stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Datenpunkte (weiß) -->
  <circle cx="78"  cy="175" r="6" fill="white"/>
  <circle cx="120" cy="153" r="6" fill="white"/>
  <circle cx="162" cy="123" r="6" fill="white"/>

  <!-- Goldener Prognose-Punkt -->
  <circle cx="204" cy="85" r="13" fill="url(#gold)"/>
  <circle cx="204" cy="85" r="6"  fill="white"/>

  <!-- Beschriftung -->
  <text x="128" y="238"
        text-anchor="middle"
        font-family="Arial, Helvetica, sans-serif"
        font-size="20" font-weight="bold"
        fill="white" fill-opacity="0.7" letter-spacing="3">PROGNOS</text>
</svg>
